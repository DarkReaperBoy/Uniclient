syntax = "proto3";

package uniclient.xmpp;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message XMPPIQ {
  bytes x_m_l_name = 1;
  string type = 2;
  string id = 3;
  string to = 4;
  string from = 5;
  string lang = 6;
  string inner = 7;
  XMPPStanzaError error = 8;
}

message XMPPStanzaError {
  string type = 1;
  string code = 2;
  string text = 3;
  string inner = 4;
}


syntax = "proto3";

package uniclient.bale;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message BaleChatInfo {
  int64 id = 1;
  string type = 2;
  string title = 3;
  string username = 4;
  string first_name = 5;
  string last_name = 6;
}

message BaleChatMember {
  BaleUserInfo user = 1;
  string status = 2;
}

message BaleFileInfo {
  string file_id = 1;
  int64 file_size = 2;
  string file_path = 3;
}

message BaleStickerSet {
  string name = 1;
  string title = 2;
  bool is_animated = 3;
}

message BaleUserInfo {
  int64 id = 1;
  bool is_bot = 2;
  string first_name = 3;
  string last_name = 4;
  string username = 5;
}

message BaleUserProfilePhotos {
  int64 total_count = 1;
}

message BaleWebhookInfo {
  string url = 1;
  bool has_custom_certificate = 2;
  int64 pending_update_count = 3;
}


  int64 msg_r_id = 2;
  int64 date_ms = 3;
  string new_text = 4;
}

message BaleUserUpdateMessageResponse {
  bytes result_1 = 1;
}

message BaleUserUpdateSearchContentClickRequest {
  string content_id = 1;
}

message BaleUserUpdateSearchContentClickResponse {
  bytes result_1 = 1;
}

message BaleUserUseGifRequest {
  int64 file_id = 1;
}

message BaleUserUseGifResponse {
  bytes result_1 = 1;
}

message BaleUserValidatePasswordRequest {
  string transaction_hash = 1;
  string password = 2;
}

message BaleUserValidatePasswordResponse {
  bytes result_1 = 1;
}

message BaleUserVotePollServiceRequest {
  string chat_id = 1;
  string msg_id = 2;
  repeated int64 option_indices = 3;
}

message BaleUserVotePollServiceResponse {
  bytes result_1 = 1;
}

message BaleValidateRamzOTPRequest {
  string otp = 1;
}

message BaleValidateRamzOTPResponse {
  bytes result_1 = 1;
}

message BaleVerifyEmailRequest {
  string email = 1;
  string code = 2;
}

message BaleVerifyEmailResponse {
  bytes result_1 = 1;
}

message BaleVerifyPasswordRecoveryRequest {
  string code = 1;
}

message BaleVerifyPasswordRecoveryResponse {
  bytes result_1 = 1;
}

message BaleVotePollRequest {
  string chat_id = 1;
  string msg_id = 2;
  int64 option_index = 3;
}

message BaleVotePollResponse {
}


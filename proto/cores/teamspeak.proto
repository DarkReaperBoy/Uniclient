syntax = "proto3";

package uniclient.teamspeak;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message TsBandwidthSnapshot {
  bytes sent_last_second = 1;
  bytes recv_last_second = 2;
  bytes sent_last_minute = 3;
  bytes recv_last_minute = 4;
  bytes total_sent_pkts = 5;
  bytes total_sent_bytes = 6;
  bytes total_recv_pkts = 7;
  bytes total_recv_bytes = 8;
  double voice_packet_loss = 9;
}

message VoicePacket {
  int64 sender_client_id = 1;
  int32 codec = 2;
  bytes audio_data = 3;
  bytes packet_counter = 4;
  bool is_whisper = 5;
  int32 server_flag = 6;
  bool has_server_flag = 7;
}


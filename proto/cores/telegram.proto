syntax = "proto3";

package uniclient.telegram;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message ActiveSession {
  int64 hash = 1;
  string device = 2;
  string platform = 3;
  string app_name = 4;
  string app_version = 5;
  string ip = 6;
  string country = 7;
  int64 date_created = 8;
  int64 date_active = 9;
  bool is_current = 10;
}

message BotCommandEntry {
  string command = 1;
  string description = 2;
  string bot_id = 3;
  string bot_name = 4;
  string bot_username = 5;
}

message CallInfo {
  int64 id = 1;
  int64 access_hash = 2;
  int64 peer_id = 3;
  bool is_outgoing = 4;
  bool p2_p_allowed = 5;
  bytes auth_key = 6;
  bytes connections = 7;
  bytes protocol = 8;
}

message CloudPasswordState {
  bool has_password = 1;
  bool has_recovery = 2;
  string hint = 3;
  string email_unconfirmed_pattern = 4;
  int64 pending_reset_date = 5;
}

message CloudThemeInfo {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  bool is_creator = 4;
  int64 accent_color = 5;
  int64 bg_color = 6;
  int64 sent_color = 7;
  int64 recv_color = 8;
  bool is_dark = 9;
}

message InlineBotResult {
  string id = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  string thumb_url = 5;
  string content_url = 6;
  int64 thumb_w = 7;
  int64 thumb_h = 8;
  string thumb_b64 = 9;
}

message InlineBotResults {
  int64 query_id = 1;
  string next_offset = 2;
  bool gallery = 3;
  repeated InlineBotResult results = 4;
  string switch_p_m = 5;
  string switch_p_m_param = 6;
}

message PeerColorEntry {
  int64 color_id = 1;
  repeated int64 day_colors = 2;
  repeated int64 night_colors = 3;
  bool hidden = 4;
}

message TelegramConfig {
  int64 a_p_i_id = 1;
  string a_p_i_hash = 2;
  bool use_test_d_c = 3;
  bytes session_storage = 4;
  bytes dial_func = 5;
  bool force_relay_i_c_e = 6;
  bool force_v2_sig = 7;
  bool force_v2_impl = 8;
  bool force_v2_ref = 9;
  bool force_v1_framing = 10;
  bool force_instance_impl = 11;
  bool no_own_offer = 12;
  string max_call_version = 13;
  string min_call_version = 14;
}


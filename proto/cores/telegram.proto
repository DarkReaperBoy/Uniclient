syntax = "proto3";

package uniclient.telegram;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message ActiveSession {
  int64 hash = 1;
  string device = 2;
  string platform = 3;
  string system_name = 4;
  string app_name = 5;
  string app_version = 6;
  string ip = 7;
  string country = 8;
  int64 date_created = 9;
  int64 date_active = 10;
  bool is_current = 11;
  bool password_pending = 12;
  int64 api_id = 13;
  bool official_app = 14;
}

message AdminLogEvent {
  int64 id = 1;
  int64 date = 2;
  int64 user_id = 3;
  string user_name = 4;
  string action = 5;
  string detail = 6;
  string old_value = 7;
  string new_value = 8;
  int64 message_id = 9;
  string msg_text = 10;
}

message BotCommandEntry {
  string command = 1;
  string description = 2;
  string bot_id = 3;
  string bot_name = 4;
  string bot_username = 5;
  string avatar_b64 = 6;
}

message CallHistoryEntry {
  string msg_id = 1;
  string peer_id = 2;
  string peer_name = 3;
  string avatar_path = 4;
  int64 timestamp = 5;
  int64 duration = 6;
  bool is_outgoing = 7;
  bool is_missed = 8;
  bool is_video = 9;
}

message CallInfo {
  int64 id = 1;
  int64 access_hash = 2;
  int64 peer_id = 3;
  bool is_outgoing = 4;
  bool p2_p_allowed = 5;
  bytes auth_key = 6;
  bytes connections = 7;
  bytes protocol = 8;
}

message ChannelUsernameInfo {
  string username = 1;
  bool active = 2;
  bool editable = 3;
}

message ChatPermissionFlags {
  int64 slowmode_seconds = 1;
  bool join_to_send = 2;
  bool no_forwards = 3;
  bool join_request = 4;
  bool is_forum = 5;
  bool antispam = 6;
  bool signatures = 7;
  bool signature_profiles = 8;
  bool pre_history_hidden = 9;
  bool no_translations = 10;
  bool has_username = 11;
  string linked_chat_id = 12;
  int64 pending_requests_count = 13;
  int64 boost_level = 14;
}

message ChatThemeInfo {
  string emoticon = 1;
  int64 id = 2;
  bool is_dark = 3;
  int64 accent_color = 4;
  repeated int64 message_colors = 5;
  repeated int64 bg_colors = 6;
}

message CloudPasswordState {
  bool has_password = 1;
  bool has_recovery = 2;
  string hint = 3;
  string email_unconfirmed_pattern = 4;
  int64 pending_reset_date = 5;
  string login_email_pattern = 6;
}

message CloudThemeInfo {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  bool is_creator = 4;
  int64 accent_color = 5;
  int64 bg_color = 6;
  int64 sent_color = 7;
  int64 recv_color = 8;
  bool is_dark = 9;
}

message DefaultBannedRights {
  bool send_plain = 1;
  bool send_photos = 2;
  bool send_videos = 3;
  bool send_roundvideos = 4;
  bool send_audios = 5;
  bool send_voices = 6;
  bool send_docs = 7;
  bool send_stickers = 8;
  bool embed_links = 9;
  bool send_polls = 10;
  bool invite_users = 11;
  bool manage_topics = 12;
  bool pin_messages = 13;
  bool edit_rank = 14;
  bool change_info = 15;
  int64 slowmode_seconds = 16;
}

message ForumTopicIconInfo {
  int64 document_id = 1;
  string emoji = 2;
}

message InlineBotResult {
  string id = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  string thumb_url = 5;
  string content_url = 6;
  int64 thumb_w = 7;
  int64 thumb_h = 8;
  string thumb_b64 = 9;
}

message InlineBotResults {
  int64 query_id = 1;
  string next_offset = 2;
  bool gallery = 3;
  repeated InlineBotResult results = 4;
  string switch_p_m = 5;
  string switch_p_m_param = 6;
}

message ParticipantExtra {
  string custom_rank = 1;
  int64 promoted_by = 2;
  int64 promoted_date = 3;
}

message PasskeyInfo {
  string id = 1;
  string name = 2;
  int64 date = 3;
}

message PasswordResetResult {
  bool done = 1;
  int64 until_date = 2;
  int64 retry_date = 3;
}

message PeerColorEntry {
  int64 color_id = 1;
  repeated int64 day_colors = 2;
  repeated int64 night_colors = 3;
  bool hidden = 4;
}

message StoryAlbumInfo {
  int64 id = 1;
  string title = 2;
  int64 count = 3;
}

message TelegramConfig {
  int64 a_p_i_id = 1;
  string a_p_i_hash = 2;
  bool use_test_d_c = 3;
  bytes session_storage = 4;
  bytes dial_func = 5;
  bool force_relay_i_c_e = 6;
  bool force_v2_sig = 7;
  bool force_v2_impl = 8;
  bool force_v2_ref = 9;
  bool force_v1_framing = 10;
  bool force_instance_impl = 11;
  bool no_own_offer = 12;
  string max_call_version = 13;
  string min_call_version = 14;
}

message WallpaperInfo {
  int64 id = 1;
  string slug = 2;
  bool pattern = 3;
  bool dark = 4;
  bool default = 5;
  repeated int64 colors = 6;
  int64 rotation = 7;
  bool blurred = 8;
}


syntax = "proto3";

package uniclient.irc;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message IRCBanEntry {
  string mask = 1;
  string set_by = 2;
  int64 set_at = 3;
}

message IRCDCCOffer {
  string type = 1;
  string filename = 2;
  string ip = 3;
  int64 port = 4;
  int64 size = 5;
  string from = 6;
}

message IRCListEntry {
  string channel = 1;
  int64 users = 2;
  string topic = 3;
}

message IRCServerInfo {
  string network = 1;
  string server_name = 2;
  string server_ver = 3;
  string user_modes = 4;
  string chan_modes = 5;
  string case_mapping = 6;
  string chan_types = 7;
  string prefix = 8;
  int64 max_nick_len = 9;
  int64 max_chan_len = 10;
  int64 max_topic_len = 11;
  int64 max_targets = 12;
  int64 max_modes = 13;
  int64 max_channels = 14;
  map<string, string> raw = 15;
}

message IRCUserhostEntry {
  string nick = 1;
  bool is_oper = 2;
  bool is_away = 3;
  string hostname = 4;
}

message IRCWhoEntry {
  string channel = 1;
  string user = 2;
  string host = 3;
  string server = 4;
  string nick = 5;
  string flags = 6;
  int64 hopcount = 7;
  string realname = 8;
}

message IRCWhowasEntry {
  string nick = 1;
  string user = 2;
  string host = 3;
  string realname = 4;
}


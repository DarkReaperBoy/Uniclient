syntax = "proto3";

package uniclient.rubika;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message RubikaAccessEntry {
  string access = 1;
}

message RubikaAvatar {
  string avatar_id = 1;
  string main_file_id = 2;
  string thumb_file_id = 3;
}

message RubikaAvatarList {
  repeated RubikaAvatar avatars = 1;
}

message RubikaBotChatInfo {
  string chat_guid = 1;
  string title = 2;
  string chat_type = 3;
  int64 count_members = 4;
}

message RubikaBotInfo {
  string user_guid = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
  bool is_bot = 5;
}

message RubikaBotJoinStatus {
  bool is_member = 1;
}

message RubikaBotSendOpts {
  string reply_to_message_id = 1;
  repeated RubikaKeypadRow inline_keypad = 2;
}

message RubikaChannelEdit {
  string title = 1;
  string description = 2;
  bool sign_messages = 3;
}

message RubikaChannelInfo {
  string channel_guid = 1;
  string channel_title = 2;
  int64 count_members = 3;
  string description = 4;
  string username = 5;
  string channel_type = 6;
  string avatar_thumbnail = 7;
  bool is_verified = 8;
  bool sign_messages = 9;
  string channel_voice_chat_id = 10;
}

message RubikaContactImportResult {
  repeated RubikaUserInfo users = 1;
}

message RubikaFileInline {
  string file_id = 1;
  string file_name = 2;
  string mime = 3;
  int64 size = 4;
  int64 dc_id = 5;
  string access_hash_rec = 6;
  string thumb_inline = 7;
  int64 width = 8;
  int64 height = 9;
}

message RubikaFolderInfo {
  string folder_id = 1;
  string name = 2;
  repeated string include_chat_types = 3;
  repeated string include_object_guids = 4;
  repeated string exclude_types = 5;
}

message RubikaGroupEdit {
  string title = 1;
  string description = 2;
  int64 slow_mode = 3;
  string chat_history = 4;
}

message RubikaGroupInfo {
  string group_guid = 1;
  string group_title = 2;
  int64 count_members = 3;
  string description = 4;
  int64 slow_mode = 5;
  string chat_history_for_new_members = 6;
  bool event_messages = 7;
  string group_type = 8;
  string username = 9;
  string avatar_thumbnail = 10;
  string group_voice_chat_id = 11;
}

message RubikaKeypadButton {
  string id = 1;
  string type = 2;
  string button_text = 3;
  string button_url = 4;
  string button_query = 5;
}

message RubikaKeypadRow {
  repeated RubikaKeypadButton buttons = 1;
}

message RubikaLinkInfo {
  string join_link = 1;
}

message RubikaMember {
  string member_guid = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
}

message RubikaMemberList {
  repeated RubikaMember members = 1;
  bool has_continue = 2;
  string next_start_id = 3;
}

message RubikaMessageShareInfo {
  string link = 1;
}

message RubikaPollStatus {
  string state = 1;
  bytes selection_count = 2;
  int64 total_count = 3;
}

message RubikaPollVoters {
  repeated RubikaMember voters = 1;
  bool has_continue = 2;
  string next_start_id = 3;
}

message RubikaPrivacySettings {
  map<string, string> settings = 1;
}

message RubikaReactionInfo {
  bytes reactions = 1;
}

message RubikaSessionInfo {
  string session_key = 1;
  string device_model = 2;
  string platform = 3;
  string app_version = 4;
  string ip = 5;
  string country = 6;
  bool is_current = 7;
}

message RubikaStickerSet {
  string sticker_set_id = 1;
  string title = 2;
  int64 count = 3;
}

message RubikaTwoStepInfo {
  bool has_password = 1;
  string password_hint = 2;
}

message RubikaUploadInfo {
  string id = 1;
  string upload_url = 2;
  string access_hash_send = 3;
  int64 dc_id = 4;
}

message RubikaUserInfo {
  string user_guid = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
  string phone = 5;
  string bio = 6;
  string avatar_thumbnail = 7;
  bool is_verified = 8;
  bool is_deleted = 9;
  int64 last_online = 10;
  string online_status = 11;
}

message RubikaVoiceChatInfo {
  string voice_chat_id = 1;
  string sdp_answer = 2;
}


syntax = "proto3";

package uniclient.matrix;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message MatrixCapabilities {
  bytes change_password = 1;
  bytes room_versions = 2;
  bytes set_display_name = 3;
  bytes set_avatar_url = 4;
  bytes third_party_id = 5;
}

message MatrixDeviceInfo {
  string device_id = 1;
  string display_name = 2;
  string last_seen_ip = 3;
  int64 last_seen_t_s = 4;
}

message MatrixLoginFlow {
  string type = 1;
}

message MatrixMediaConfig {
  int64 upload_size = 1;
}

message MatrixRoomSummary {
  string room_id = 1;
  string name = 2;
  string canonical_alias = 3;
  string topic = 4;
  string avatar_url = 5;
  int64 num_joined_members = 6;
  string room_type = 7;
  string join_rule = 8;
  bool world_readable = 9;
  bool guest_can_join = 10;
  string membership = 11;
  bool encryption_enabled = 12;
  repeated string allowed_room_ids = 13;
}

message MatrixTurnServer {
  string username = 1;
  string password = 2;
  repeated string uris = 3;
  int64 ttl = 4;
}

message MatrixURLPreview {
  string title = 1;
  string description = 2;
  string image_url = 3;
  string image_type = 4;
  int64 image_width = 5;
  int64 image_height = 6;
  string matrix_image = 7;
}


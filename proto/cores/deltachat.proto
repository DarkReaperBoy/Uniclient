syntax = "proto3";

package uniclient.deltachat;

option go_package = "uniclient/proto/cores";

import "proto/models.proto";

// ═══════════════════════════════════════════════════════════════════
// Core-specific types
// ═══════════════════════════════════════════════════════════════════

message DCLocation {
  double lat = 1;
  double lon = 2;
  int64 time = 3;
  string sender = 4;
  string chat_id = 5;
  bool independent = 6;
}

message DCLocationStream {
  string chat_id = 1;
  int64 duration = 2;
  int64 start_at = 3;
  bytes cancel = 4;
}

message DCTransport {
  string id = 1;
  string email = 2;
  string password = 3;
  string i_m_a_p_host = 4;
  string s_m_t_p_host = 5;
}

message DCWebxdcUpdate {
  int64 serial = 1;
  bytes payload = 2;
  string info = 3;
  string sender = 4;
  int64 time = 5;
}

message DeltaChatProviderInfo {
  int64 status = 1;
  string before_login_hint = 2;
  string after_login_hint = 3;
  string overview_page = 4;
  string i_m_a_p_host = 5;
  int64 i_m_a_p_port = 6;
  string s_m_t_p_host = 7;
  int64 s_m_t_p_port = 8;
}

message DeltaChatQuotaInfo {
  int64 current = 1;
  int64 limit = 2;
}

message DeltaChatStorageReport {
  int64 session_bytes = 1;
  int64 total_bytes = 2;
  int64 messages_count = 3;
  int64 chats_count = 4;
  int64 contacts_count = 5;
}

message DeltaChatWebxdcInfo {
  string name = 1;
  string icon = 2;
  string source_code_url = 3;
  string summary = 4;
}


message EngineGetConfigResponse {
  string theme         = 1;
  string accent_color  = 2;
  double font_scale    = 3;
  string language      = 4;
  string download_dir  = 5;
  int64  max_cache_size = 6;
  bool   send_read_receipts = 7;
  bool   send_typing   = 8;
  bool   notify_dms    = 9;
  bool   notify_groups = 10;
  bool   notify_mentions_only = 11;
}

message EngineUpdateConfigRequest {
  string theme         = 1;
  string accent_color  = 2;
  double font_scale    = 3;
  string language      = 4;
  int64  max_cache_size = 5;
  // Privacy — use has_* flags since false is a valid value (not "unset").
  bool send_read_receipts     = 6;
  bool has_send_read_receipts = 7;
  bool send_typing            = 8;
  bool has_send_typing        = 9;
  // Notifications
  bool notify_dms              = 10;
  bool has_notify_dms          = 11;
  bool notify_groups           = 12;
  bool has_notify_groups       = 13;
  bool notify_mentions_only    = 14;
  bool has_notify_mentions_only = 15;
}


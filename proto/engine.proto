// Engine layer messages — request/response types for go/engine/ dispatch.
// core_id = "__engine" routes here instead of to a platform core.
syntax = "proto3";

package uniclient;

option go_package = "uniclient/proto";

// Note: models.proto types (Message, Dialog, etc.) are referenced via go imports,
// not proto imports, since engine types use their own flattened representations.

// ═══════════════════════════════════════════════════════════════════════
// Engine events (Go → Dart, pushed asynchronously)
// ═══════════════════════════════════════════════════════════════════════

message EngineEvent {
  string type       = 1; // event type key (e.g. "msg_received", "conn_state")
  string account_id = 2;
  int64  timestamp_ms = 3;
  bytes  data_json  = 4; // JSON-encoded event data (type-specific)
}

// ═══════════════════════════════════════════════════════════════════════
// Account management
// ═══════════════════════════════════════════════════════════════════════

message AccountInfo {
  string id           = 1;
  string platform     = 2;
  string display_name = 3;
  string avatar_path  = 4;
  int32  sort_order   = 5;
  int32  conn_state   = 6;
  bool   is_verified  = 7;
  bool   is_premium   = 8;
  string phone        = 9;
  string username     = 10;
}

// --- Init ---

message EngineInitRequest {
  string config_dir   = 1;
  string cache_dir    = 2;
  string download_dir = 3;
  string vault_password = 4;
}

message EngineInitResponse {
  bool ok = 1;
  string error = 2;
}

// --- ListAccounts ---

message EngineListAccountsResponse {
  repeated AccountInfo accounts = 1;
}

// --- AddAccount ---

message EngineAddAccountRequest {
  string platform = 1;
}

message EngineAddAccountResponse {
  string account_id = 1;
}

// --- RemoveAccount ---

message EngineRemoveAccountRequest {
  string account_id = 1;
}

// --- ReorderAccounts ---

message EngineReorderAccountsRequest {
  repeated string account_ids = 1;
}

// --- ConnectAccount ---

message EngineConnectAccountRequest {
  string account_id = 1;
}

// --- DisconnectAccount ---

message EngineDisconnectAccountRequest {
  string account_id = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Auth flow
// ═══════════════════════════════════════════════════════════════════════

message AuthOption {
  string id    = 1;
  string label = 2;
}

message EngineAuthState {
  string account_id = 1;
  string platform   = 2;
  string state      = 3; // "choose", "input", "otp", "2fa", "qr", "ready", "error"

  repeated AuthOption options = 10;
  string field_type  = 11;
  string label       = 12;
  string hint        = 13;
  string error       = 14;
  int32  code_length = 15;
  string sent_to     = 16;
  int32  timeout_secs = 17;
  bool   can_resend  = 18;
  bool   has_recovery = 19;
  bytes  qr_data     = 20;
  int32  qr_expires_in = 21;
  string display_name = 22;
  string avatar_b64  = 23;
  string message     = 24;
  bool   recoverable = 25;
}

message EngineStartAuthRequest {
  string account_id = 1;
}

message EngineStartAuthResponse {
  EngineAuthState state = 1;
}

message EngineSubmitAuthInputRequest {
  string account_id = 1;
  string input      = 2;
}

message EngineSubmitAuthInputResponse {
  EngineAuthState state = 1;
}

message EngineCancelAuthRequest {
  string account_id = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Chat list
// ═══════════════════════════════════════════════════════════════════════

message EngineChatInfo {
  string account_id      = 1;
  string chat_id         = 2;
  int32  type            = 3;
  string title           = 4;
  string avatar_path     = 5;
  string last_msg_id     = 6;
  string last_msg_text   = 7;
  int64  last_msg_time   = 8;
  string last_msg_sender       = 9;
  bool   last_msg_is_outgoing = 17;
  int32  unread_count         = 10;
  bool   is_muted        = 11;
  bool   is_pinned       = 12;
  bool   is_archived     = 13;
  string draft_text      = 14;
  int32  member_count    = 15;
  string parent_id       = 16;
  bool   is_bot          = 18;
  int32  last_msg_status = 19;
  bool   is_contact      = 20;
  bool   is_blocked      = 21;
}

message EngineGetChatListRequest {
  string account_id = 1; // empty = unified (all accounts)
  bool   archived   = 2;
  int32  limit      = 3;
  int32  offset     = 4;
}

message EngineGetChatListResponse {
  repeated EngineChatInfo chats = 1;
}

message EngineSaveDraftRequest {
  string account_id = 1;
  string chat_id    = 2;
  string text       = 3;
}

message EngineMuteChatRequest {
  string account_id = 1;
  string chat_id    = 2;
  bool   muted      = 3;
}

message EnginePinChatRequest {
  string account_id = 1;
  string chat_id    = 2;
  bool   pinned     = 3;
}

message EngineArchiveChatRequest {
  string account_id = 1;
  string chat_id    = 2;
  bool   archived   = 3;
}

message EngineMarkChatReadRequest {
  string account_id  = 1;
  string chat_id     = 2;
  string up_to_msg_id = 3;
}

message EngineBlockUserRequest {
  string account_id = 1;
  string user_id    = 2;
}

message EngineUnblockUserRequest {
  string account_id = 1;
  string user_id    = 2;
}

message EngineAddContactRequest {
  string account_id = 1;
  string phone      = 2;
  string first_name = 3;
  string last_name  = 4;
}

// --- GetForumTopics ---

message EngineGetForumTopicsRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineGetForumTopicsResponse {
  repeated EngineChatInfo chats = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Messages
// ═══════════════════════════════════════════════════════════════════════

message EngineCachedMessage {
  string account_id    = 1;
  string chat_id       = 2;
  string msg_id        = 3;
  string local_id      = 4;
  string sender_id     = 5;
  string sender_name   = 6;
  string content_text  = 7;
  bytes  content_raw   = 8;
  bytes  content_rich  = 9;
  int64  timestamp     = 10;
  int64  edited_at     = 11;
  int32  status        = 12;
  string reply_to_id   = 13;
  string reply_preview = 14;
  string forward_from  = 15;
  bool   is_pinned     = 16;
  bool   has_media     = 17;

  // Media metadata (populated from media table join).
  int32  media_type      = 18; // 0=none, 1=image, 2=video, 3=audio, 4=voice, 5=videonote, 6=sticker, 7=gif, 8=file
  string media_file_name = 19;
  string media_mime_type = 20;
  int64  media_file_size = 21;
  string media_thumb_b64 = 22; // base64-encoded thumbnail (small preview)
  string media_local_path = 23; // local file path if downloaded
  int32  media_width     = 24;
  int32  media_height    = 25;
  int32  media_duration  = 26; // seconds (audio/video)
  int32  media_download_state = 27; // 0=none, 1=in_progress, 2=complete, 3=failed
  bool   is_outgoing   = 28;
  string sender_rank   = 29; // admin/creator custom title (e.g. "admin", "owner")
  int32  sender_color_id = 30; // name color palette index (0..63)
  bool   is_service    = 31; // service/action message (e.g. "X joined the group")
  string grouped_id   = 32; // album group ID (messages with same ID form a media album)
}

message EngineGetMessagesRequest {
  string account_id = 1;
  string chat_id    = 2;
  int64  before_ms  = 3; // 0 = most recent
  int32  limit      = 4;
}

message EngineGetMessagesResponse {
  repeated EngineCachedMessage messages = 1;
}

message EngineSendMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string text       = 3;
  string reply_to_id = 4;
}

message EngineSendMessageResponse {
  string local_id = 1;
}

message EngineEditMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
  string new_text   = 4;
}

message EngineDeleteMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
}

message EngineJoinChatRequest {
  string account_id   = 1;
  string channel_name  = 2;
}

message EngineLeaveChatRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineForwardMessageRequest {
  string account_id  = 1;
  string chat_id     = 2;
  string msg_id      = 3;
  string to_chat_id  = 4;
}

message EngineReactToMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
  string emoji      = 4;
}

message EnginePinMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
  bool   pinned     = 4;
}

message EngineUploadFileRequest {
  string account_id = 1;
  string chat_id    = 2;
  string file_path  = 3;
  string caption    = 4;
}

message EngineUploadFileResponse {
  string msg_id = 1;
}

message EngineRetryPendingRequest {
  string local_id = 1;
}

message EngineGetMessageRawRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
}

message EngineGetMessageRawResponse {
  bytes content_raw = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Members
// ═══════════════════════════════════════════════════════════════════════

message EngineMemberInfo {
  string user_id      = 1;
  string username     = 2;
  string display_name = 3;
  string avatar_b64   = 4;
  bool   is_bot       = 5;
  bool   is_online    = 6;
  string role         = 7; // "owner", "admin", "member", "restricted", "banned"
}

message EngineGetChatMembersRequest {
  string account_id = 1;
  string chat_id    = 2;
  int32  limit      = 3;
  int32  offset     = 4;
}

message EngineGetChatMembersResponse {
  repeated EngineMemberInfo members = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Active chat (notification suppression)
// ═══════════════════════════════════════════════════════════════════════

message EngineSetActiveChatRequest {
  string account_id = 1;
  string chat_id    = 2;
}

// ═══════════════════════════════════════════════════════════════════════
// Search
// ═══════════════════════════════════════════════════════════════════════

message EngineSearchResult {
  string account_id  = 1;
  string chat_id     = 2;
  string msg_id      = 3;
  string sender_name = 4;
  string text        = 5;
  int64  timestamp   = 6;
  string chat_title  = 7;
}

message EngineSearchMessagesRequest {
  string query      = 1;
  string account_id = 2; // empty = all accounts
  int32  limit      = 3;
}

message EngineSearchMessagesResponse {
  repeated EngineSearchResult results = 1;
}

message EngineSearchChatsRequest {
  string query = 1;
  int32  limit = 2;
}

message EngineSearchChatsResponse {
  repeated EngineChatInfo chats = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Media
// ═══════════════════════════════════════════════════════════════════════

message EngineRequestDownloadRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
  int32  seq        = 4;
  int32  priority   = 5;
}

message EngineCancelDownloadRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
  int32  seq        = 4;
}

message EngineGetCacheSizeResponse {
  int64 size_bytes = 1;
}

message EngineClearCacheRequest {
  string account_id = 1; // empty = all
}

// --- GetSharedMedia ---

message EngineGetSharedMediaRequest {
  string account_id = 1;
  string chat_id    = 2;
  string media_type = 3; // "image", "video", "audio", "file", "" for all
  int32  limit      = 4;
  int32  offset     = 5;
}

message EngineSharedMediaItem {
  string msg_id     = 1;
  int64  timestamp  = 2;
  int32  media_type = 3; // 1=image, 2=video, 3=audio, 4=voice, 5=videonote, 6=sticker, 7=gif, 8=file
  string file_name  = 4;
  string mime_type  = 5;
  int64  file_size  = 6;
  string thumb_b64  = 7;
  string local_path = 8;
  int32  width      = 9;
  int32  height     = 10;
  int32  duration   = 11; // seconds
}

message EngineGetSharedMediaResponse {
  repeated EngineSharedMediaItem items = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Config
// ═══════════════════════════════════════════════════════════════════════

message EngineGetConfigResponse {
  string theme         = 1;
  string accent_color  = 2;
  double font_scale    = 3;
  string language      = 4;
  string download_dir  = 5;
  int64  max_cache_size = 6;
  bool   send_read_receipts = 7;
  bool   send_typing   = 8;
  bool   notify_dms    = 9;
  bool   notify_groups = 10;
  bool   notify_mentions_only = 11;
}

message EngineUpdateConfigRequest {
  string theme         = 1;
  string accent_color  = 2;
  double font_scale    = 3;
  string language      = 4;
  int64  max_cache_size = 5;
  // Privacy — use has_* flags since false is a valid value (not "unset").
  bool send_read_receipts     = 6;
  bool has_send_read_receipts = 7;
  bool send_typing            = 8;
  bool has_send_typing        = 9;
  // Notifications
  bool notify_dms              = 10;
  bool has_notify_dms          = 11;
  bool notify_groups           = 12;
  bool has_notify_groups       = 13;
  bool notify_mentions_only    = 14;
  bool has_notify_mentions_only = 15;
}

// ═══════════════════════════════════════════════════════════════════════
// Folders
// ═══════════════════════════════════════════════════════════════════════

message EngineFolderInfo {
  string id   = 1;
  string name = 2;
  repeated string chat_ids = 3;
  repeated string exclude_chat_ids = 4;
  repeated string pinned_chat_ids  = 5;
  bool contacts        = 6;
  bool non_contacts    = 7;
  bool groups          = 8;
  bool channels        = 9;
  bool bots            = 10;
  bool exclude_muted   = 11;
  bool exclude_read    = 12;
  bool exclude_archived = 13;
}

message EngineGetFoldersRequest {
  string account_id = 1;
}

message EngineGetFoldersResponse {
  repeated EngineFolderInfo folders = 1;
}

message EngineDeleteFolderRequest {
  string account_id = 1;
  string folder_id  = 2;
}

message EngineEditFolderRequest {
  string account_id = 1;
  string folder_id  = 2;
  string title      = 3;
}

// ═══════════════════════════════════════════════════════════════════════
// Pinned Messages
// ═══════════════════════════════════════════════════════════════════════

message EngineGetPinnedMessagesRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineGetPinnedMessagesResponse {
  repeated EngineCachedMessage messages = 1;
}

// ══════════════���══════════════════════════════��═════════════════════════
// Create Channel
// ══════���═══════════════════���════════════════════════════════════════════

message EngineCreateChannelRequest {
  string account_id  = 1;
  string name        = 2;
  string description = 3;
}

message EngineCreateChannelResponse {
  EngineChatInfo chat = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Contacts
// ═══════════════════════════════════════════════════════════════════════

message EngineContactInfo {
  string user_id      = 1;
  string username     = 2;
  string display_name = 3;
  string phone        = 4;
  string avatar_b64   = 5;
  bool   is_bot       = 6;
  bool   is_online    = 7;
}

message EngineGetContactsRequest {
  string account_id = 1;
}

message EngineGetContactsResponse {
  repeated EngineContactInfo contacts = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Online count (group/channel subtitle)
// ═══════════════════════════════════════════════════════════════════════

message EngineGetOnlineCountRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineGetOnlineCountResponse {
  int32 online_count = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Group Call (active voice chat in group/channel)
// ═══════════════════════════════════════════════════════════════════════

message EngineGroupCallParticipant {
  string user_id      = 1;
  string display_name = 2;
  bool   is_muted     = 3;
  bool   is_speaking  = 4;
  bool   has_video    = 5;
  string avatar_path  = 6;
}

message EngineGroupCallInfo {
  string call_id                              = 1;
  string chat_id                              = 2;
  string title                                = 3;
  int32  participants_count                    = 4;
  repeated EngineGroupCallParticipant participants = 5;
  bool   active                               = 6;
}

message EngineGetGroupCallRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineGetGroupCallResponse {
  EngineGroupCallInfo group_call = 1;
}

message EngineJoinGroupCallRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineJoinGroupCallResponse {
  string call_id = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Scheduled Messages
// ═══════════════════════════════════════════════════════════════════════

message EngineSendScheduledNowRequest {
  string account_id       = 1;
  string chat_id          = 2;
  repeated string msg_ids = 3;
}

// ═════════════════════════════════════════════════════════════════════���═
// Peer Colors (extended 64-entry name color palette from help.peerColors)
// ═══════════════════════════════════════════════════════════════════════

message EnginePeerColorEntry {
  int32 color_id            = 1;  // 0..63
  repeated int32 day_colors = 2;  // 1-3 RGB ints (light mode)
  repeated int32 night_colors = 3;  // 1-3 RGB ints (dark mode, may be empty)
  bool hidden               = 4;
}

message EngineGetPeerColorsRequest {
  string account_id = 1;
}

message EngineGetPeerColorsResponse {
  repeated EnginePeerColorEntry colors = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// Sticker Set Info (for sticker pack viewer)
// ═══════════════════════════════════════════════════════════════════════

message EngineGetStickerSetInfoRequest {
  string account_id = 1;
  string short_name = 2;  // sticker set short name (e.g. "AnimatedEmojis")
  int64  set_id     = 3;  // alternative: sticker set numeric ID (used when short_name is empty)
  int64  access_hash = 4; // required when using set_id
}

message EngineStickerInfo {
  string emoji     = 1;  // emoji associated with this sticker
  string thumb_b64 = 2;  // base64 stripped thumbnail
  int32  width     = 3;
  int32  height    = 4;
  string mime_type = 5;  // e.g. "image/webp", "application/x-tgsticker", "video/webm"
  string file_id   = 6;  // document ID for downloading
}

message EngineGetStickerSetInfoResponse {
  string title      = 1;  // display title of the set
  string short_name = 2;  // canonical short name
  int32  count      = 3;  // total number of stickers
  bool   installed  = 4;  // whether the user has this set installed
  bool   archived   = 5;
  bool   animated   = 6;
  bool   video      = 7;
  repeated EngineStickerInfo stickers = 8;
}

// ═══════════════════════════════════════════════════════════════════════
// Voice Transcription (messages.transcribeAudio)
// ═══════════════════════════════════════════════════════════════════════

message EngineTranscribeAudioRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
}

message EngineTranscribeAudioResponse {
  bool   pending           = 1;
  int64  transcription_id  = 2;
  string text              = 3;
}

  bool   is_muted        = 11;
  bool   is_pinned       = 12;
  bool   is_archived     = 13;
  string draft_text      = 14;
  int32  member_count    = 15;
  string parent_id       = 16;
  bool   is_bot          = 18;
  int32  last_msg_status = 19;
  bool   is_contact      = 20;

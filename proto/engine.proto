// ═══════════════════════════════════════════════════════════════════════
// Saved Messages Sublists (spec §31.2–31.3)
// ═══════════════════════════════════════════════════════════════════════

message EngineGetSavedSublistsRequest {
  string account_id     = 1;
  int32  limit          = 2;
  int32  offset_date    = 3;
  int32  offset_id      = 4;
  bool   exclude_pinned = 5;
}

message EngineSavedSublist {
  string peer_id       = 1;
  string peer_name     = 2;
  string avatar_path   = 3;
  int32  type          = 4; // 1=user, 2=group, 3=channel
  bool   is_pinned     = 5;
  int32  top_message   = 6;
  string last_msg_text = 7;
  int64  last_msg_time = 8;
  bool   is_self       = 9;
  int32  unread_count  = 10;
}

message EngineGetSavedSublistsResponse {
  repeated EngineSavedSublist sublists = 1;
  int32 total_count = 2;
}

// Saved Reaction Tags (spec §31.6)
// ═══════════════════════════════════════════════════════════════════════

message EngineGetSavedReactionTagsRequest {
  string account_id       = 1;
  string sublist_peer_id  = 2; // optional: filter by sublist peer
}

message EngineSavedReactionTag {
  string emoji     = 1; // unicode emoji (mutually exclusive with custom_id)
  int64  custom_id = 2; // custom emoji document ID
  string title     = 3; // user-assigned tag name
  int32  count     = 4; // number of messages with this tag
}

message EngineGetSavedReactionTagsResponse {
  repeated EngineSavedReactionTag tags = 1;
}

message EngineRenameSavedReactionTagRequest {
  string account_id = 1;
  string emoji      = 2; // unicode emoji (mutually exclusive with custom_id)
  int64  custom_id  = 3; // custom emoji document ID
  string title      = 4; // new title (empty to remove)
}

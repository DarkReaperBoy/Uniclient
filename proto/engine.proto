}

message EngineSharedMediaItem {
  string msg_id     = 1;
  int64  timestamp  = 2;
  int32  media_type = 3; // 1=image, 2=video, 3=audio, 4=voice, 5=videonote, 6=sticker, 7=gif, 8=file
  string file_name  = 4;
  string mime_type  = 5;
  int64  file_size  = 6;
  string thumb_b64  = 7;
  string local_path = 8;

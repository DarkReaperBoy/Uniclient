// ═══════════════════════════════════════════════════════════════════════
// Messages
// ═══════════════════════════════════════════════════════════════════════

message EngineCachedMessage {
  string account_id    = 1;
  string chat_id       = 2;
  string msg_id        = 3;
  string local_id      = 4;
  string sender_id     = 5;
  string sender_name   = 6;
  string content_text  = 7;
  bytes  content_raw   = 8;
  bytes  content_rich  = 9;
  int64  timestamp     = 10;
  int64  edited_at     = 11;
  int32  status        = 12;
  string reply_to_id   = 13;
  string reply_preview = 14;
  string forward_from  = 15;
  bool   is_pinned     = 16;
  bool   has_media     = 17;

  // Media metadata (populated from media table join).
  int32  media_type      = 18; // 0=none, 1=image, 2=video, 3=audio, 4=voice, 5=videonote, 6=sticker, 7=gif, 8=file
  string media_file_name = 19;
  string media_mime_type = 20;
  int64  media_file_size = 21;
  string media_thumb_b64 = 22; // base64-encoded thumbnail (small preview)
  string media_local_path = 23; // local file path if downloaded
  int32  media_width     = 24;
  int32  media_height    = 25;
  int32  media_duration  = 26; // seconds (audio/video)
  int32  media_download_state = 27; // 0=none, 1=in_progress, 2=complete, 3=failed
  bool   is_outgoing   = 28;
  string sender_rank   = 29; // admin/creator custom title (e.g. "admin", "owner")
  int32  sender_color_id = 30; // name color palette index (0..63)
  bool   is_service    = 31; // service/action message (e.g. "X joined the group")
  string grouped_id   = 32; // album group ID (messages with same ID form a media album)
  string media_remote_ref = 33; // document/file ID for sticker/GIF operations
  string media_extra      = 34; // encoded access hash + file reference
}

message EngineGetMessagesRequest {
  string account_id = 1;
  string chat_id    = 2;
  int64  before_ms  = 3; // 0 = most recent
  int32  limit      = 4;
}

message EngineGetMessagesResponse {
  repeated EngineCachedMessage messages = 1;
}

message EngineSendMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string text       = 3;
  string reply_to_id = 4;
  bool   silent     = 5;
  int64  schedule_date = 6;
  string topic_root_id = 7;
}

message EngineSendMessageResponse {
  string local_id = 1;
}

message EngineEditMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
  string new_text   = 4;
}

message EngineDeleteMessageRequest {
  string account_id = 1;
  string chat_id    = 2;
  string msg_id     = 3;
}

message EngineJoinChatRequest {
  string account_id   = 1;
  string channel_name  = 2;
}

message EngineLeaveChatRequest {
  string account_id = 1;
  string chat_id    = 2;
}

message EngineForwardMessageRequest {

name: uniclient
description: Unified multi-platform messaging client.
version: 0.1.0-alpha
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ^3.29.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  protobuf: ^4.1.0
  fixnum: ^1.1.0
  provider: ^6.1.2
  collection: ^1.19.0
  web: ^1.1.0
  qr_flutter: ^4.1.0
  lottie: ^3.3.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_linux: ^1.2.1
  file_picker: ^3.0.4
  desktop_drop: ^0.5.0
  dbus: ^0.7.12
  crypto: ^3.0.6
  archive: ^4.0.2
  image: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/icon/icon_256.png
    - assets/animations/

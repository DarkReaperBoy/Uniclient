# Uniclient manual verification runner.
#
# Dispatch-only (never runs on push — AGENTS.md §1.5). Use it to verify any
# commit without cutting a release:
#   GitHub → Actions → Verify → Run workflow (branch/ref)
# Runs the full quality gate + cross-builds + a real headless-engine smoke.
# The Xvfb GUI smoke + android + wasm artifact legs return with the rebuilt
# GUI (AGENTS.md).

name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  test:
    name: Test & vet & gofmt & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Gio client libs (cgo shims, AGENTS.md §7)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Comment ban (AGENTS.md §2)
        run: python3 scripts/strip_comments.py --check
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: gofmt gate
        run: cd go && test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - name: Vet
        run: cd go && CGO_ENABLED=1 go vet -tags goolm ./...
      - name: Vet (live-tagged integration tests)
        # the `live` build-tagged test files are otherwise
        # never compiled on CI — only local gates caught breakage there.
        run: cd go && CGO_ENABLED=1 go vet -tags goolm,live ./tests/
      - name: Test
        run: cd go && CGO_ENABLED=1 go test -p 1 -tags goolm -count=1 ./...
        env:
          GOMEMLIMIT: 900MiB
          GOGC: "30"
      - name: Race (core subsets)
        # same legs the local gate races, memory-capped for the runner
        # (the race detector is not optional on any gate).
        run: |
          cd go
          CGO_ENABLED=1 go test -p 1 -tags goolm -count=1 -race ./tests/cores/ \
            -run 'TestHandshake|TestMyChannelID|TestTSExec|TestTS3|TestTeamSpeak|TestTSCommandQueue|TestSendVoice|TestGetGroupCall|TestMatrix|TestParseRawHeaders|TestAutocrypt|TestDeltaChat|TestGitHub|TestLockOrder|TestChatOpenHotPaths|TestLogoutDoesNotHold|TestReadPathRPCs|TestReadFilePart|TestRPCGuard|TestTSReceive'
        env:
          GOMEMLIMIT: 900MiB
          GOGC: "30"
      - name: Headless engine smoke (AGENTS.md §4 — real interface)
        run: |
          cd go
          CGO_ENABLED=1 go build -p 1 -tags goolm -o ../uniclient ./cmd/uniclient
          cd ..
          rm -rf /tmp/uc-home
          timeout --preserve-status -s TERM 15 ./uniclient -dir /tmp/uc-home -events > /tmp/uc.log 2>&1
          rc=$?
          cat /tmp/uc.log
          [ "$rc" -eq 0 ] || { echo "engine exited $rc on SIGTERM (want 0)"; exit 1; }
          grep -q "engine ready" /tmp/uc.log || { echo "no 'engine ready' line"; exit 1; }
          test -f /tmp/uc-home/uniclient.vault || { echo "vault not created"; exit 1; }
          echo "headless smoke OK: booted, vault created, clean SIGTERM exit"
        env:
          GOMEMLIMIT: 900MiB
          GOGC: "30"

  nix:
    name: Nix flake gate (nix run github:…)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: flake.nix version must match the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)";/\1/p' flake.nix)
          if [ "$want" != "$have" ]; then
            echo "flake.nix version=$have but releasing v$want — bump version in flake.nix first"
            exit 1
          fi
      - name: README command shape — lockless `nix run`
        # No flake.lock in the repo (owner rule, gitignored): this is the
        # exact no-lock/no-write path `nix run github:… --no-write-lock-file`
        # takes on the owner's machine — build + `uniclient -h` smoke in one.
        run: |
          set +e
          nix run --no-write-lock-file . -- -h
          rc=$?
          set -e
          case "$rc" in
            0|2) echo "smoke OK (exit $rc)" ;;
            *) echo "nix run failed (exit $rc)"; exit 1 ;;
          esac
      - name: nix build .#uniclient (packages.default)
        run: nix build .#uniclient -L

  cross-builds:
    name: Cross-builds (windows + js/wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Windows (pure Go)
        run: |
          cd go
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -p 1 -tags goolm \
            -trimpath -ldflags "-s -w" -o ../dist/uniclient-windows-amd64.exe ./cmd/uniclient
        env:
          GOMEMLIMIT: 900MiB
          GOGC: "30"
      - name: js/wasm compile check (web target foundation)
        # no wasm artifact ships until the rebuilt GUI lands — but the
        # engine/audio/js halves must keep compiling (AGENTS.md §1.4).
        run: |
          cd go
          mkdir -p ../dist/jscheck
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -p 1 -tags goolm \
            -o ../dist/jscheck ./...
        env:
          GOMEMLIMIT: 900MiB
          GOGC: "30"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-builds
          path: dist/uniclient-windows-amd64.exe
          if-no-files-found: error

# One-shot maintenance job: computes the nix vendorHash for flake.nix and
# commits it (needed after dependency changes). Manual dispatch only.

name: Flake vendor hash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Compute vendorHash and patch flake.nix
        run: |
          set -euo pipefail
          OUT=$(nix build .#uniclient 2>&1 || true)
          echo "$OUT" | tail -20
          HASH=$(echo "$OUT" | grep -oP "got: *'?sha256-[A-Za-z0-9+/=]+" | head -1 | grep -oP "sha256-[A-Za-z0-9+/=]+")
          if [ -z "${HASH:-}" ]; then
            echo "no new hash needed (build succeeded or unknown error)"
            exit 0
          fi
          echo "computed: $HASH"
          sed -i "s|vendorHash = \"[^\"]*\"|vendorHash = \"$HASH\"|" flake.nix
          grep vendorHash flake.nix
          # verify it now builds
          nix build .#uniclient
      - name: Commit if changed
        run: |
          git config user.name "uniclient-ci"
          git config user.email "ci@uniclient.local"
          if git diff --quiet flake.nix; then
            echo "no changes"
          else
            git add flake.nix
            git commit -qm "flake: pin vendorHash (computed by CI)"
            git push
          fi

name: Release (Linux x86_64)

# Builds the Linux desktop app (Go engine + Flutter UI) on a clean Ubuntu
# runner — the exact "ordinary Linux" path documented in the README — and
# publishes a tarball.
#
#   * push a tag like  v0.1.0-alpha   -> builds + creates a GitHub Release
#   * run manually (workflow_dispatch) -> builds + uploads a workflow artifact
#
# The runner install steps are deliberately identical to the README's
# "Option A — Ordinary Linux" instructions, so green CI == the docs work.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on tag push

env:
  GO_VERSION: "1.26.1"
  FLUTTER_VERSION: "3.41.5"
  FLUTTER_SHA256: "18901d456a5e458c4c69fa7859852b64fac29da9f89476a959abfacbac7f4fdb"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git xz-utils zip unzip build-essential \
            clang lld cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            libayatana-appindicator3-dev

      - name: Install Go ${{ env.GO_VERSION }}
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          cd /opt
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o flutter.tar.xz
          echo "${FLUTTER_SHA256}  flutter.tar.xz" | sha256sum -c -
          sudo tar xf flutter.tar.xz
          sudo chown -R "$(id -u):$(id -g)" /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          git config --global --add safe.directory /opt/flutter
          flutter --version
          flutter config --enable-linux-desktop
          flutter precache --linux

      - name: Build Go engine (libcores.so)
        run: bash scripts/build_go.sh linux

      - name: Build Flutter Linux bundle (release)
        run: |
          ( cd dart && flutter pub get )
          # build_flutter.sh is the build entry point (a bare `flutter build linux`
          # can't assemble this repo's older linux/ scaffold). Unset the runner's
          # Android SDK so the native-assets step targets linux-x64, not Android.
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT bash scripts/build_flutter.sh linux release

      - name: Assemble bundle
        id: assemble
        run: |
          BUNDLE="dart/build/linux/x64/release/bundle"
          # The Go engine — the FFI loader looks for it in <exe>/lib/.
          cp go/build/libcores.so "$BUNDLE/lib/"
          # Bundle libmpv so the tarball doesn't depend on the host's libmpv
          # being at a specific soname (its own deps still come from the system).
          MPV="$(find /usr/lib /usr/lib/x86_64-linux-gnu -name 'libmpv.so.2*' 2>/dev/null | head -1)"
          if [ -n "$MPV" ]; then cp -L "$MPV" "$BUNDLE/lib/libmpv.so.2"; fi
          ls -la "$BUNDLE" "$BUNDLE/lib"
          VERSION="$(grep '^version:' dart/pubspec.yaml | sed 's/version: *//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TARBALL="uniclient-${VERSION}-linux-x86_64.tar.gz"
          tar -C "dart/build/linux/x64/release" -czf "$TARBALL" bundle
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniclient-linux-x86_64
          path: ${{ steps.assemble.outputs.tarball }}
          if-no-files-found: error

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.assemble.outputs.tarball }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Uniclient ${GITHUB_REF_NAME}" \
            --notes "Automated Linux x86_64 build (Go ${GO_VERSION} + Flutter ${FLUTTER_VERSION}).

          **Requires a Wayland session** (the app forces the GTK Wayland backend).
          Runtime deps: \`libgtk-3-0\`, \`libmpv2\` (and its codecs), \`libayatana-appindicator3-1\` (optional).

          Extract and run:
          \`\`\`
          tar xzf ${{ steps.assemble.outputs.tarball }}
          ./bundle/uniclient
          \`\`\`" \
            --prerelease
